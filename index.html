<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="image-side">
            <img src="858353819_1112796134670527_2782117749518425950_n-removebg-preview.png" alt="Perfume">
            <h1>SAVANT</h1>
            <p>Discover your signature scent</p>
        </div>


        <div class="login-side">

            <div class="login-box">

                <h2>Sign in</h2>
                <p>sign in or create an account</p>

                <form>

                    <input type="text" placeholder="Email Address">

                    <input type="password" placeholder="Password">

                    <div class="options">
                        <label>
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#">Forgot Password?</a>
                    </div>


                    <button>LOGIN</button>

                </form>


                <p class="signup">
                    Don't have an account?
                    <a href="#">Create Account</a>
                </p>

            </div>

        </div>

    </div>


</body>
</html>
